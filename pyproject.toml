[project]
name = "ecommerce-ai-assistant"
version = "0.1.0"
description = "Minimal MVP for an e-commerce AI assistant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "streamlit>=1.36.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.vercel]
entrypoint = "src.ecommerce_assistant.api.service:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_assistant"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/data",
  "/tests",
  "/README.md",
  "/.env.example",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"
