services:
  api:
    build: .
    container_name: ecommerce-assistant-api
    command: python src/run_service.py
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    restart: unless-stopped

  streamlit:
    build: .
    container_name: ecommerce-assistant-ui
    command: streamlit run src/ecommerce_assistant/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://api:8080"
    depends_on:
      - api
    restart: unless-stopped
